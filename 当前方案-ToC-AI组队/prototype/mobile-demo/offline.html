<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>RALLY · 当前离线</title>
    <style>
      :root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #253341; background: #f5f7fa; }
      body { min-height: 100dvh; margin: 0; display: grid; place-items: center; padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom)); box-sizing: border-box; }
      main { max-width: 360px; padding: 28px; border: 1px solid #dce3eb; border-radius: 26px; background: #fff; box-shadow: 0 20px 55px rgba(31,48,70,.12); }
      strong { color: #155acb; letter-spacing: -.04em; }
      h1 { margin: 18px 0 10px; font-size: 27px; }
      p { color: #65727e; line-height: 1.65; }
      button { min-height: 48px; width: 100%; border: 0; border-radius: 14px; background: #155acb; color: #fff; font: inherit; font-weight: 750; }
    </style>
  </head>
  <body><main><strong>RALLY</strong><h1>当前网络不可用</h1><p>已缓存的产品外壳仍可打开，但连接、入队、任务与公开状态必须联网完成，不会在离线时误报成功。</p><button onclick="location.reload()">重新连接</button></main></body>
</html>
