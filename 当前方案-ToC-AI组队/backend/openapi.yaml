openapi: 3.1.0
info:
  title: COSPAN API
  version: 0.8.0
  description: >-
    HTTP/JSON contract for activity-scoped identity, authorized external
    evidence, short-lived nearby presence, NFC/QR connections, confirmed team
    formation, the human-controlled COSPAN Space, project SOS, audit activity,
    and protected demo reset.
servers:
  - url: http://127.0.0.1:8787
tags:
  - name: System
  - name: Analysis
  - name: Identity
  - name: Presence
  - name: Connections
  - name: Projects
  - name: Room
  - name: SOS
  - name: Analytics
  - name: Agents
paths:
  /health:
    get:
      tags: [System]
      summary: Check service readiness
      responses:
        "200":
          description: API status and whether the public SMS login flow is usable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }
  /api/analytics/events:
    post:
      tags: [Analytics]
      summary: Ingest allowlisted first-party client analytics events
      description: >-
        Accepts only discovery, match impression, detail, and Room view events.
        Business outcomes and SMS events are produced by the backend. Phone numbers,
        verification codes, tokens, names, free text, and precise location are rejected.
      security: [{ BearerAuth: [] }, { DemoHeader: [] }, {}]
      parameters:
        - $ref: "#/components/parameters/AnalyticsAnonymousId"
        - $ref: "#/components/parameters/AnalyticsSessionId"
        - $ref: "#/components/parameters/AnalyticsClientType"
        - $ref: "#/components/parameters/AnalyticsAppVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnalyticsBatch" }
      responses:
        "202":
          description: Batch validated and de-duplicated
          content:
            application/json:
              schema:
                type: object
                required: [accepted, duplicates]
                properties:
                  accepted: { type: integer, minimum: 0, maximum: 20 }
                  duplicates: { type: integer, minimum: 0, maximum: 20 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
  /api/admin/analytics/summary:
    get:
      tags: [Analytics]
      summary: Read protected event counts, funnels, sources, and data quality
      security: [{ AnalyticsAdminToken: [] }]
      parameters:
        - $ref: "#/components/parameters/AnalyticsExhibitionId"
      responses:
        "200":
          description: First-party analytics summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnalyticsSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/admin/analytics/export:
    get:
      tags: [Analytics]
      summary: Export protected raw first-party events as CSV
      security: [{ AnalyticsAdminToken: [] }]
      parameters:
        - $ref: "#/components/parameters/AnalyticsExhibitionId"
      responses:
        "200":
          description: CSV without phone numbers, verification codes, tokens, names, or free text
          content:
            text/csv:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/admin/analytics/events:
    get:
      tags: [Analytics]
      summary: Read up to 100 recent first-party events in a protected debug environment
      description: Returns 404 unless ANALYTICS_DEBUG_ENABLED=1; production demo deployments leave it disabled.
      security: [{ AnalyticsAdminToken: [] }]
      parameters:
        - $ref: "#/components/parameters/AnalyticsExhibitionId"
        - in: query
          name: limit
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
      responses:
        "200":
          description: Recent allowlisted events
          content:
            application/json:
              schema:
                type: object
                required: [exhibition_id, events]
                properties:
                  exhibition_id: { type: string }
                  events:
                    type: array
                    maxItems: 100
                    items: { type: object, additionalProperties: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/admin/analytics/users/{userId}:
    delete:
      tags: [Analytics]
      summary: Delete one user's analytics and linked pre-login anonymous events
      description: Does not delete business audit logs or another authenticated user's events.
      security: [{ AnalyticsAdminToken: [] }]
      parameters:
        - in: path
          name: userId
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
        - $ref: "#/components/parameters/AnalyticsExhibitionId"
      responses:
        "200":
          description: Deletion result
          content:
            application/json:
              schema:
                type: object
                required: [exhibition_id, user_id, deleted_events]
                properties:
                  exhibition_id: { type: string }
                  user_id: { type: string }
                  deleted_events: { type: integer, minimum: 0 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/auth/demo-sessions:
    post:
      tags: [System]
      summary: Issue a revocable session for a seeded demo account
      security: [{ DemoAccessKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id: { type: string }
      responses:
        "201": { description: Bearer session issued }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
  /api/auth/experience-sessions:
    post:
      tags: [Identity]
      summary: Exchange a signed experience-group link for a real participant session
      description: >-
        A campaign link can create one hidden COSPAN identity per browser device up to its signed
        participant limit. Reopening the same link on the same device resumes that identity. The
        invite is removed from the browser URL before exchange and is never stored as the session token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, client_id]
              properties:
                token: { type: string, minLength: 40, maxLength: 2048 }
                client_id: { type: string, pattern: "^client_[A-Za-z0-9_-]{32,128}$" }
      responses:
        "201":
          description: Bearer session issued for a new or returning experience participant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OtpSessionResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { description: The signed participant capacity has been reached }
        "503": { description: Experience-group login is not configured }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
  /api/auth/email/status:
    get:
      tags: [Identity]
      summary: Check whether transactional email login is configured
      security: []
      responses:
        "200":
          description: Email login readiness without exposing provider credentials
          content:
            application/json:
              schema:
                type: object
                required: [enabled]
                properties:
                  enabled: { type: boolean }
  /api/auth/email/challenges:
    post:
      tags: [Identity]
      summary: Send a one-time login code to an email address
      description: Codes expire after ten minutes and the response never contains the code.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, maxLength: 254 }
      responses:
        "201":
          description: Email challenge created and accepted by the configured provider
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmailChallengeResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "502": { description: Email provider rejected or could not deliver the request }
        "503": { description: Email login is not configured }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
  /api/auth/email/sessions:
    post:
      tags: [Identity]
      summary: Verify an email code and issue a revocable Bearer session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailVerificationInput"
      responses:
        "201":
          description: Existing account restored or a new hidden identity created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OtpSessionResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { description: Email login is not configured }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
  /api/me/auth-methods:
    get:
      tags: [Identity]
      summary: Read masked login methods for the current account
      security: [{ BearerAuth: [] }, { DemoHeader: [] }]
      responses:
        "200":
          description: Only binding booleans and masked destinations are returned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthMethodsResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/me/email/challenges:
    post:
      tags: [Identity]
      summary: Send a code for binding email to the current account
      security: [{ BearerAuth: [] }, { DemoHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, maxLength: 254 }
      responses:
        "201":
          description: Binding challenge created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmailChallengeResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "502": { description: Email provider rejected or could not deliver the request }
        "503": { description: Email login is not configured }
  /api/me/email:
    put:
      tags: [Identity]
      summary: Verify and bind email to the current account
      security: [{ BearerAuth: [] }, { DemoHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailVerificationInput" }
      responses:
        "200": { description: Email binding completed }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { description: Email is already bound to another account }
        "503": { description: Email login is not configured }
  /api/auth/otp/challenges:
    post:
      tags: [Identity]
      summary: Send a one-time verification code to a mainland China mobile number
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string, examples: ["13800138000"] }
      responses:
        "201":
          description: >-
            Verification challenge created. `delivery_mode` identifies whether Tencent Cloud
            accepted a real SMS request or the server is intentionally using a non-delivery demo/test mode.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OtpChallengeResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "502": { description: SMS provider rejected or could not deliver the request }
        "503": { description: SMS login is not configured }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
  /api/auth/otp/sessions:
    post:
      tags: [Identity]
      summary: Verify a one-time code and issue a revocable Bearer session
      description: >-
        The first successful verification for a phone creates a COSPAN identity and
        a hidden minimum profile in 2026 AI Hardware Hackathon (`hackathon-2026`). Challenges expire
        after five minutes, allow five failed attempts, and are consumed once.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge_id, code]
              properties:
                challenge_id: { type: string }
                code: { type: string, pattern: "^[0-9]{6}$" }
      responses:
        "201":
          description: Bearer session issued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OtpSessionResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "503": { description: SMS login is not configured }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
  /api/auth/oauth/providers:
    get:
      tags: [Identity]
      summary: List server-configured OAuth login providers
      security: []
      responses:
        "200":
          description: Provider readiness without credentials
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OAuthProvidersResponse" }
  /api/auth/oauth/{provider}/start:
    get:
      tags: [Identity]
      summary: Start a Google or WeChat authorization-code flow
      security: []
      parameters:
        - $ref: "#/components/parameters/OAuthProvider"
        - in: query
          name: return_to
          required: true
          description: Same-origin web URL; Android uses the verified `/auth/android` HTTPS App Link.
          schema: { type: string, format: uri }
        - in: query
          name: code_challenge
          required: true
          description: Base64url SHA-256 challenge derived from the initiating client's secret verifier.
          schema: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" }
      responses:
        "302": { description: Redirect to the selected provider }
        "400": { $ref: "#/components/responses/BadRequest" }
        "503": { description: Provider or base OAuth settings are incomplete }
  /api/auth/oauth/{provider}/callback:
    get:
      tags: [Identity]
      summary: Receive the provider callback and return a short-lived one-time ticket
      description: >-
        The callback validates a signed expiring state, resolves the provider identity,
        then redirects to the approved return URL. Bearer tokens are never included in
        this redirect.
      security: []
      parameters:
        - $ref: "#/components/parameters/OAuthProvider"
        - in: query
          name: state
          required: true
          schema: { type: string }
        - in: query
          name: code
          required: false
          schema: { type: string }
        - in: query
          name: error
          required: false
          schema: { type: string }
      responses:
        "302": { description: Redirect with oauth_ticket or a normalized oauth_error }
        "400": { $ref: "#/components/responses/BadRequest" }
        "503": { description: Provider or base OAuth settings are incomplete }
  /api/auth/oauth/sessions:
    post:
      tags: [Identity]
      summary: Exchange an OAuth login ticket for a revocable Bearer session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ticket, verifier]
              properties:
                ticket: { type: string, minLength: 40, maxLength: 128 }
                verifier: { type: string, minLength: 43, maxLength: 128, pattern: "^[A-Za-z0-9_-]+$" }
      responses:
        "201":
          description: Bearer session issued; the ticket is consumed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OAuthSessionResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
  /api/auth/session:
    delete:
      tags: [System]
      summary: Revoke the current Bearer session
      security: [{ BearerAuth: [] }]
      responses:
        "204": { description: Session revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/events:
    get:
      tags: [Identity]
      summary: List events and whether the current user has joined
      security: [{ BearerAuth: [] }, { DemoHeader: [] }]
      responses:
        "200": { description: Event list }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/me:
    get:
      tags: [Identity]
      summary: Read the current user, event profiles, and linked platforms
      security: [{ BearerAuth: [] }, { DemoHeader: [] }]
      responses:
        "200": { description: Private current-user view }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/me/activity:
    get:
      tags: [Identity]
      summary: Read audit activity caused by the current user
      security: [{ BearerAuth: [] }, { DemoHeader: [] }]
      parameters:
        - in: query
          name: event_id
          required: false
          schema: { type: string }
      responses:
        "200": { description: Personal activity records }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/events/{eventId}/join:
    post:
      tags: [Identity]
      summary: Join an active event with a minimum collaboration profile
      security: [{ BearerAuth: [] }, { DemoHeader: [] }]
      parameters:
        - $ref: "#/components/parameters/EventId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileInput" }
      responses:
        "201": { description: Joined with visibility initially hidden }
        "200": { description: Idempotent replay of an existing membership }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
  /api/events/{eventId}/profile:
    patch:
      tags: [Identity]
      summary: Update the current user's event profile
      security: [{ BearerAuth: [] }, { DemoHeader: [] }]
      parameters:
        - $ref: "#/components/parameters/EventId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileInput" }
      responses:
        "200": { description: Updated profile }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
  /api/events/{eventId}/visibility:
    patch:
      tags: [Identity]
      summary: Publish, pause, or hide authorized event profile fields
      security: [{ BearerAuth: [] }, { DemoHeader: [] }]
      parameters:
        - $ref: "#/components/parameters/EventId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state]
              properties:
                state: { type: string, enum: [HIDDEN, VISIBLE, PAUSED] }
                expires_at: { type: string, format: date-time }
                public_fields:
                  type: array
                  uniqueItems: true
                  items:
                    type: string
                    enum: [display_name, avatar, role, status, skills, interests, availability, collaboration_preferences, collaboration_need, evidence, platform_links]
      responses:
        "200": { description: Visibility grant updated }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
  /api/events/{eventId}/discover:
    get:
      tags: [Identity]
      summary: List authorized discoverable profiles for an event
      security: [{ BearerAuth: [] }, { DemoHeader: [] }]
      parameters:
        - $ref: "#/components/parameters/EventId"
        - in: query
          name: project_id
          required: false
          description: Optional member-owned project whose open role needs should drive deterministic ranking.
          schema: { type: string }
      responses:
        "200": { description: Profiles with deterministic explanation fields }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/me/platform-links/{platform}:
    put:
      tags: [Identity]
      summary: Save one user-authorized external profile or portfolio link
      description: >-
        GitHub may synchronize public metadata. Other platforms retain only the
        submitted HTTPS link and are never treated as platform-verified.
      security: [{ BearerAuth: [] }, { DemoHeader: [] }]
      parameters:
        - $ref: "#/components/parameters/Platform"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, format: uri, pattern: "^https://" }
      responses:
        "200": { description: Link saved, with optional public metadata }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
    delete:
      tags: [Identity]
      summary: Remove one linked platform from COSPAN
      security: [{ BearerAuth: [] }, { DemoHeader: [] }]
      parameters:
        - $ref: "#/components/parameters/Platform"
      responses:
        "204": { description: Link absent or removed }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/events/{eventId}/presence:
    put:
      tags: [Presence]
      summary: Publish a short-lived foreground phone location heartbeat
      security: [{ BearerAuth: [] }, { DemoHeader: [] }]
      parameters:
        - $ref: "#/components/parameters/EventId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PresenceInput" }
      responses:
        "200": { description: Heartbeat stored with a short expiry }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
    delete:
      tags: [Presence]
      summary: Stop nearby discovery and remove the current heartbeat
      security: [{ BearerAuth: [] }, { DemoHeader: [] }]
      parameters:
        - $ref: "#/components/parameters/EventId"
      responses:
        "204": { description: Presence absent or removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/events/{eventId}/nearby:
    get:
      tags: [Presence]
      summary: List nearby authorized participants without exposing coordinates
      security: [{ BearerAuth: [] }, { DemoHeader: [] }]
      parameters:
        - $ref: "#/components/parameters/EventId"
      responses:
        "200": { description: Distance bands, never peer latitude or longitude }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /c/{opaqueToken}:
    get:
      tags: [Connections]
      summary: Resolve an NFC, QR, or shared-link public card
      parameters:
        - in: path
          name: opaqueToken
          required: true
          schema: { type: string }
        - in: query
          name: event
          required: true
          schema: { type: string }
        - in: query
          name: src
          required: false
          schema: { type: string, enum: [nfc, qr, link], default: link }
      responses:
        "200": { description: Only currently authorized fields }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/cards/{opaqueToken}/profile:
    get:
      deprecated: true
      tags: [Connections]
      summary: Compatibility alias for the public card endpoint
      parameters:
        - in: path
          name: opaqueToken
          required: true
          schema: { type: string }
        - in: query
          name: event_id
          required: true
          schema: { type: string }
        - in: query
          name: source
          required: false
          schema: { type: string, enum: [nfc, qr, link], default: link }
      responses:
        "200": { description: Authorized public profile }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/connections/physical-mutual:
    post:
      tags: [Connections]
      summary: Create one direct connection from a trusted two-card touch device
      description: >-
        The trusted hardware or handshake simulator submits two active opaque card
        tokens in one physical event. The server creates at most one Connection and
        persists consent_mode=physical_mutual while recording touch attribution; the
        device key must never be embedded in the public mobile client. If the pair is
        already connected, the original consent mode is preserved and a new touch
        attribution event is appended.
      security: [{ TouchDeviceKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event_id, card_a_token, card_b_token]
              properties:
                event_id: { type: string }
                card_a_token: { type: string }
                card_b_token: { type: string }
      responses:
        "201": { description: Physical-mutual Connection created }
        "200": { description: Existing pair Connection returned idempotently with touch attribution }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
  /api/connections/requests:
    get:
      tags: [Connections]
      summary: Poll incoming or outgoing connection requests
      security: [{ BearerAuth: [] }, { DemoHeader: [] }]
      parameters:
        - in: query
          name: event_id
          required: true
          schema: { type: string }
        - in: query
          name: direction
          required: false
          schema: { type: string, enum: [incoming, outgoing], default: incoming }
        - in: query
          name: status
          required: false
          schema: { type: string, enum: [REQUESTED, ACCEPTED, REJECTED, CANCELLED, EXPIRED, BLOCKED] }
      responses:
        "200": { description: Requests plus server time and polling hint }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Connections]
      summary: Create an idempotent connection request
      security: [{ BearerAuth: [] }, { DemoHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recipient_id, event_id, source]
              properties:
                recipient_id: { type: string }
                event_id: { type: string }
                source: { type: string, enum: [nfc, qr, link] }
                message: { type: string, maxLength: 240 }
                candidate_id:
                  type: string
                  description: Selected internal candidate ID; must equal recipient_id when supplied.
                list_request_id:
                  type: string
                  format: uuid
                  description: Discovery list request used for first-party funnel attribution.
      responses:
        "201": { description: Request created }
        "200": { description: Existing request or connection returned idempotently }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "429": { description: Rate limited or inside rejection cooldown }
  /api/connections/requests/{requestId}:
    patch:
      tags: [Connections]
      summary: Accept, reject, cancel, or block a connection request
      security: [{ BearerAuth: [] }, { DemoHeader: [] }]
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [accept, reject, cancel, block] }
                reason_code: { type: string, maxLength: 64 }
      responses:
        "200": { description: Transition completed or replayed }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/connections/{connectionId}:
    get:
      tags: [Connections]
      summary: Read one connection as either participant
      security: [{ BearerAuth: [] }, { DemoHeader: [] }]
      parameters:
        - in: path
          name: connectionId
          required: true
          schema: { type: string }
      responses:
        "200": { description: Connection }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/connections/{connectionId}/conversation:
    get:
      tags: [Connections]
      summary: Read the lightweight one-to-one conversation for an active connection
      description: Returns up to the most recent 100 messages and the caller's independent unread state. Reading does not create a project or membership.
      security: [{ BearerAuth: [] }, { DemoHeader: [] }]
      parameters:
        - in: path
          name: connectionId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Conversation and client polling hint
          content:
            application/json:
              schema:
                type: object
                required: [conversation, sync]
                properties:
                  conversation: { $ref: "#/components/schemas/DirectConversation" }
                  sync:
                    type: object
                    required: [server_time, poll_after_ms]
                    properties:
                      server_time: { type: string, format: date-time }
                      poll_after_ms: { type: integer, minimum: 1000 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    patch:
      tags: [Connections]
      summary: Advance the caller's read cursor for one connection conversation
      security: [{ BearerAuth: [] }, { DemoHeader: [] }]
      parameters:
        - in: path
          name: connectionId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [last_read_message_id]
              properties:
                last_read_message_id:
                  type: string
                  pattern: "^msg_[A-Za-z0-9-]{16,80}$"
      responses:
        "200":
          description: Updated conversation and unread count
          content:
            application/json:
              schema:
                type: object
                required: [conversation]
                properties:
                  conversation: { $ref: "#/components/schemas/DirectConversation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/connections/{connectionId}/messages:
    post:
      tags: [Connections]
      summary: Send one text message inside an active connection
      description: The optional client_message_id makes weak-network retries idempotent for the same sender and connection.
      security: [{ BearerAuth: [] }, { DemoHeader: [] }]
      parameters:
        - in: path
          name: connectionId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [text]
              properties:
                text: { type: string, minLength: 1, maxLength: 1000 }
                client_message_id:
                  type: string
                  pattern: "^[A-Za-z0-9_-]{8,80}$"
      responses:
        "201":
          description: Message created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DirectConversationMessageResult" }
        "200":
          description: Idempotent replay of an existing message
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DirectConversationMessageResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/projects:
    get:
      tags: [Projects]
      summary: List projects the current user has joined for one event
      security: [{ BearerAuth: [] }, { DemoHeader: [] }]
      parameters:
        - in: query
          name: event_id
          required: true
          schema: { type: string }
      responses:
        "200": { description: Projects with current membership, role needs, and members }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Projects]
      summary: Create a project, its originator membership, and first role need
      security: [{ BearerAuth: [] }, { DemoHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectInput" }
      responses:
        "201": { description: Project created }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/projects/{projectId}:
    get:
      tags: [Projects]
      summary: Read project, open roles, and members
      security: [{ BearerAuth: [] }, { DemoHeader: [] }]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200": { description: Project view }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/projects/{projectId}/invitations:
    post:
      tags: [Projects]
      summary: Invite an active connection into an available project role
      security: [{ BearerAuth: [] }, { DemoHeader: [] }]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invitee_id, role_need_id]
              properties:
                invitee_id: { type: string }
                role_need_id: { type: string }
      responses:
        "201": { description: Invitation pending recipient confirmation }
        "200": { description: Existing invitation returned idempotently }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/team-invitations:
    get:
      tags: [Projects]
      summary: Poll incoming or outgoing project invitations
      security: [{ BearerAuth: [] }, { DemoHeader: [] }]
      parameters:
        - in: query
          name: event_id
          required: true
          schema: { type: string }
        - in: query
          name: direction
          required: false
          schema: { type: string, enum: [incoming, outgoing], default: incoming }
        - in: query
          name: status
          required: false
          schema: { type: string, enum: [PENDING, ACCEPTED, DECLINED, CANCELLED, EXPIRED] }
      responses:
        "200": { description: Invitations with project, counterpart, and role context }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/team-invitations/{invitationId}:
    patch:
      tags: [Projects]
      summary: Accept or decline as recipient, or cancel as inviter
      security: [{ BearerAuth: [] }, { DemoHeader: [] }]
      parameters:
        - $ref: "#/components/parameters/InvitationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [accept, decline, cancel] }
      responses:
        "200": { description: Invitation resolved; acceptance creates membership }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/projects/{projectId}/starter-pack:
    post:
      tags: [Room]
      summary: Generate a three-task starter pack without assigning owners
      security: [{ BearerAuth: [] }, { DemoHeader: [] }]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "201": { description: Proposed starter pack and tasks }
        "200": { description: Existing pack returned idempotently }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/projects/{projectId}/plan-confirmations:
    post:
      tags: [Room]
      summary: Confirm the starter pack as one project member
      security: [{ BearerAuth: [] }, { DemoHeader: [] }]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - in: header
          name: x-cospan-surface
          schema: { type: string, enum: [mobile, desktop], default: mobile }
          required: false
          description: Trusted client surface label recorded in the project audit trail.
      responses:
        "200": { description: Confirmation progress; all members are required }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/projects/{projectId}/room:
    get:
      tags: [Room]
      summary: Read the project launch room and protected activity timeline
      security: [{ BearerAuth: [] }, { DemoHeader: [] }]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200": { description: Project, members, needs, pack, tasks, SOS, and activity }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/tasks/{taskId}:
    patch:
      tags: [Room]
      summary: Claim or move a human-owned task through its state machine
      description: Agent suggestions never set the confirmed owner.
      security: [{ BearerAuth: [] }, { DemoHeader: [] }]
      parameters:
        - $ref: "#/components/parameters/TaskId"
        - in: header
          name: x-cospan-surface
          schema: { type: string, enum: [mobile, desktop], default: mobile }
          required: false
          description: Trusted client surface label recorded in the project audit trail.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [claim, start, complete, block] }
      responses:
        "200": { description: Task updated or replayed idempotently }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/tasks/{taskId}/agent-runs:
    post:
      tags: [Agents]
      summary: Trigger a research brief agent run for a HUMAN_AGENT task
      description: Only the confirmed task owner may trigger. Blocked when the plan is not CONFIRMED, a run is already in flight, or the daily token budget is exhausted.
      security: [{ BearerAuth: [] }, { DemoHeader: [] }]
      parameters:
        - $ref: "#/components/parameters/TaskId"
        - in: header
          name: x-idempotency-key
          schema: { type: string, maxLength: 120 }
          required: false
          description: Retry-safe replay key. Reusing the same key within 10 minutes returns the original run.
      responses:
        "201": { description: New agent run created and awaiting review }
        "200": { description: Idempotent replay of a previous run }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { description: Daily project token budget exhausted }
        "503": { description: Agent runner is not configured on this deployment }
  /api/projects/{projectId}/agent-runs:
    get:
      tags: [Agents]
      summary: List the most recent agent runs and current daily token budget for a project
      security: [{ BearerAuth: [] }, { DemoHeader: [] }]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200": { description: Up to 10 recent runs plus the project's daily budget snapshot }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/agent-runs/{runId}:
    get:
      tags: [Agents]
      summary: Read a single agent run with output and audit metadata
      security: [{ BearerAuth: [] }, { DemoHeader: [] }]
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200": { description: Full agent run detail }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/agent-runs/{runId}/review:
    post:
      tags: [Agents]
      summary: Approve or reject a pending agent run
      description: Only the task owner (or trigger, for planner runs) may decide. Terminal decisions cannot be replayed.
      security: [{ BearerAuth: [] }, { DemoHeader: [] }]
      parameters:
        - $ref: "#/components/parameters/RunId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [APPROVED, REJECTED] }
                note: { type: string, maxLength: 500 }
      responses:
        "200": { description: Run reviewed and moved to APPROVED or REJECTED }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/agent-runs/{runId}/cancel:
    post:
      tags: [Agents]
      summary: Cancel a QUEUED or RUNNING agent run
      description: Trigger or project originator only.
      security: [{ BearerAuth: [] }, { DemoHeader: [] }]
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200": { description: Run moved to CANCELLED }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/projects/{projectId}/sos:
    post:
      tags: [SOS]
      summary: Publish one structured active SOS for a project
      description: A reward is an intent record only; COSPAN does not process money.
      security: [{ BearerAuth: [] }, { DemoHeader: [] }]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SosInput" }
      responses:
        "201": { description: SOS opened }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/events/{eventId}/sos:
    get:
      tags: [SOS]
      summary: List active project SOS posts inside one joined event
      security: [{ BearerAuth: [] }, { DemoHeader: [] }]
      parameters:
        - $ref: "#/components/parameters/EventId"
      responses:
        "200": { description: Active SOS feed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/sos/{sosId}/responses:
    post:
      tags: [SOS]
      summary: Offer help without automatically joining the project
      security: [{ BearerAuth: [] }, { DemoHeader: [] }]
      parameters:
        - $ref: "#/components/parameters/SosId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message, available_minutes]
              properties:
                message: { type: string, maxLength: 500 }
                available_minutes: { type: integer, minimum: 5, maximum: 480 }
      responses:
        "201": { description: Help response created }
        "200": { description: Existing response returned idempotently }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/sos-responses/{responseId}:
    patch:
      tags: [SOS]
      summary: Accept a help response as originator/leader, or withdraw as the selected responder
      security: [{ BearerAuth: [] }, { DemoHeader: [] }]
      parameters:
        - $ref: "#/components/parameters/ResponseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [accept, withdraw] }
                reason:
                  type: string
                  maxLength: 500
                  description: Required when the selected responder withdraws.
      responses:
        "200": { description: Response changed; project membership remains unchanged }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/sos/{sosId}:
    patch:
      tags: [SOS]
      summary: Resolve, close, or reopen an SOS as its publisher
      security: [{ BearerAuth: [] }, { DemoHeader: [] }]
      parameters:
        - $ref: "#/components/parameters/SosId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [resolve, close, reopen] }
                resolution_note:
                  type: string
                  maxLength: 1000
                  description: Required for resolve and close; omitted for reopen.
      responses:
        "200": { description: SOS resolved or replayed idempotently }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/demo/reset:
    post:
      tags: [System]
      summary: Clear mutable demo data and restore deterministic fixtures
      security: [{ DemoAccessKey: [] }]
      responses:
        "200": { description: Reset completed while auth sessions remain valid }
        "403": { $ref: "#/components/responses/Forbidden" }
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-session-token
    DemoHeader:
      type: apiKey
      in: header
      name: x-demo-user-id
      description: Disabled unless ALLOW_INSECURE_DEMO_AUTH=1; local demo use only.
    DemoAccessKey:
      type: apiKey
      in: header
      name: x-demo-access-key
    TouchDeviceKey:
      type: apiKey
      in: header
      name: x-touch-device-key
      description: Trusted hardware or handshake-simulator secret; never expose it to the public mobile client.
    AnalyticsAdminToken:
      type: apiKey
      in: header
      name: x-analytics-admin-token
      description: Independent server-only secret; never expose it to the public mobile client or APK.
  parameters:
    AnalyticsAnonymousId:
      in: header
      name: x-rally-anonymous-id
      required: true
      schema: { type: string, format: uuid }
    AnalyticsSessionId:
      in: header
      name: x-rally-session-id
      required: true
      schema: { type: string, format: uuid }
    AnalyticsClientType:
      in: header
      name: x-rally-client-type
      required: true
      schema: { type: string, enum: [android_webview, mobile_web] }
    AnalyticsAppVersion:
      in: header
      name: x-rally-app-version
      required: true
      schema: { type: string, pattern: "^[A-Za-z0-9._:+-]{1,64}$" }
    AnalyticsExhibitionId:
      in: query
      name: exhibition_id
      required: false
      schema: { type: string, default: hackathon-2026 }
    EventId:
      in: path
      name: eventId
      required: true
      schema: { type: string }
    ProjectId:
      in: path
      name: projectId
      required: true
      schema: { type: string }
    RequestId:
      in: path
      name: requestId
      required: true
      schema: { type: string }
    InvitationId:
      in: path
      name: invitationId
      required: true
      schema: { type: string }
    TaskId:
      in: path
      name: taskId
      required: true
      schema: { type: string }
    SosId:
      in: path
      name: sosId
      required: true
      schema: { type: string }
    ResponseId:
      in: path
      name: responseId
      required: true
      schema: { type: string }
    Platform:
      in: path
      name: platform
      required: true
      schema:
        type: string
        enum: [github, website, xiaohongshu, douyin, jike, linkedin, other]
    OAuthProvider:
      in: path
      name: provider
      required: true
      schema:
        type: string
        enum: [google, wechat]
  schemas:
    HealthResponse:
      type: object
      required: [status, service, sms_login, sms_delivery, email_login, email_delivery, analytics]
      properties:
        status: { type: string, const: ok }
        service: { type: string, const: rally-api }
        sms_login: { type: string, enum: [ready, disabled] }
        sms_delivery: { type: string, enum: [tencent_cloud, fixed_demo, test, disabled] }
        email_login: { type: string, enum: [ready, disabled] }
        email_delivery: { type: string, enum: [resend, disabled] }
        analytics: { type: string, const: ready }
    AnalyticsBatch:
      type: object
      required: [events]
      additionalProperties: false
      properties:
        events:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: "#/components/schemas/AnalyticsClientEvent" }
    AnalyticsClientEvent:
      type: object
      additionalProperties: false
      required:
        - analytics_event_id
        - event_name
        - anonymous_id
        - exhibition_id
        - session_id
        - source
        - client_type
        - app_version
        - properties
        - occurred_at
      properties:
        analytics_event_id: { type: string, format: uuid }
        event_name:
          type: string
          enum: [discovery_viewed, match_impression, match_detail_opened, room_viewed]
        anonymous_id: { type: string, format: uuid }
        exhibition_id: { type: string }
        session_id: { type: string, format: uuid }
        source:
          type: string
          enum: [online_recommendation, nearby, project_room]
        client_type: { type: string, enum: [android_webview, mobile_web] }
        app_version: { type: string, pattern: "^[A-Za-z0-9._:+-]{1,64}$" }
        object_type: { type: string, maxLength: 64 }
        object_id: { type: string, maxLength: 128 }
        properties:
          type: object
          description: Exact property set is selected by event_name and enforced by the server allowlist.
          additionalProperties: false
          properties:
            result_count_bucket: { type: string, enum: ["0", "1-5", "6-20", "21+"] }
            filter_count: { type: integer, minimum: 0, maximum: 20 }
            list_request_id: { type: string, format: uuid }
            candidate_id: { type: string, maxLength: 128 }
            rank: { type: integer, minimum: 1, maximum: 1000 }
            rule_score_bucket: { type: string, enum: [low, medium, high, unknown] }
            reason_count: { type: integer, minimum: 0, maximum: 20 }
            project_id: { type: string, maxLength: 128 }
            member_count: { type: integer, minimum: 0, maximum: 100 }
            pack_status: { type: string, enum: [none, PROPOSED, CONFIRMED, ARCHIVED] }
        occurred_at: { type: string, format: date-time }
    AnalyticsSummary:
      type: object
      required: [exhibition_id, generated_at, event_counts, funnels, sources, app_versions, data_quality]
      properties:
        exhibition_id: { type: string }
        generated_at: { type: string, format: date-time }
        event_counts: { type: array, items: { type: object, additionalProperties: true } }
        funnels: { type: array, items: { type: object, additionalProperties: true } }
        sources: { type: array, items: { type: object, additionalProperties: true } }
        app_versions: { type: array, items: { type: object, additionalProperties: true } }
        data_quality: { type: object, additionalProperties: true }
    UserIdentity:
      type: object
      required: [id, display_name, avatar]
      properties:
        id: { type: string }
        display_name: { type: string, minLength: 1, maxLength: 40 }
        avatar: { type: string }
    OtpChallengeResponse:
      type: object
      required: [challenge_id, masked_phone, delivery_mode, expires_at, retry_after_seconds]
      properties:
        challenge_id: { type: string, pattern: "^otp_[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$" }
        masked_phone: { type: string, pattern: "^[0-9]{3}\\*{4}[0-9]{4}$" }
        delivery_mode: { type: string, enum: [tencent_cloud, fixed_demo, test] }
        expires_at: { type: string, format: date-time }
        retry_after_seconds: { type: integer, minimum: 1 }
    EmailChallengeResponse:
      type: object
      required: [challenge_id, masked_email, expires_at, retry_after_seconds]
      properties:
        challenge_id: { type: string, pattern: "^email_[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$" }
        masked_email: { type: string }
        expires_at: { type: string, format: date-time }
        retry_after_seconds: { type: integer, minimum: 1 }
    EmailVerificationInput:
      type: object
      required: [challenge_id, code]
      properties:
        challenge_id: { type: string, pattern: "^email_[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$" }
        code: { type: string, pattern: "^[0-9]{6}$" }
    AuthMethodsResponse:
      type: object
      required: [email, phone]
      properties:
        email:
          type: object
          required: [bound, masked_email]
          properties:
            bound: { type: boolean }
            masked_email: { type: [string, "null"] }
        phone:
          type: object
          required: [bound, masked_phone]
          properties:
            bound: { type: boolean }
            masked_phone: { type: [string, "null"] }
    OtpSessionResponse:
      type: object
      required: [access_token, token_type, expires_at, is_new_user, user]
      properties:
        access_token: { type: string, minLength: 40 }
        token_type: { type: string, const: Bearer }
        expires_at: { type: string, format: date-time }
        is_new_user: { type: boolean }
        user: { $ref: "#/components/schemas/UserIdentity" }
    OAuthProvidersResponse:
      type: object
      required: [providers]
      properties:
        providers:
          type: object
          required: [google, wechat]
          properties:
            google: { $ref: "#/components/schemas/OAuthProviderReadiness" }
            wechat: { $ref: "#/components/schemas/OAuthProviderReadiness" }
    OAuthProviderReadiness:
      type: object
      required: [enabled, android_enabled]
      properties:
        enabled: { type: boolean }
        android_enabled:
          type: boolean
          description: True only when this provider is supported in the APK and its HTTPS App Link is configured.
    OAuthSessionResponse:
      allOf:
        - $ref: "#/components/schemas/OtpSessionResponse"
        - type: object
          required: [provider]
          properties:
            provider: { type: string, enum: [google, wechat] }
    ProfileInput:
      type: object
      required: [role, status, skills, interests, availability, collaboration_preferences, collaboration_need, evidence]
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 40
          description: Optional account display name; login itself does not require a nickname.
        role: { type: string, maxLength: 80 }
        status:
          type: string
          enum: [未组队, 有 Idea 找人, 团队缺人, 已组队但可交流]
        skills:
          type: array
          minItems: 3
          maxItems: 5
          items: { type: string, maxLength: 40 }
        interests:
          type: array
          minItems: 1
          maxItems: 5
          items: { type: string, maxLength: 60 }
        availability: { type: string, minLength: 1, maxLength: 120 }
        collaboration_preferences:
          type: array
          minItems: 1
          maxItems: 5
          items: { type: string, maxLength: 60 }
        collaboration_need: { type: string, maxLength: 160 }
        evidence:
          type: array
          maxItems: 12
          items: { type: string, maxLength: 160 }
    DirectConversationMessage:
      type: object
      required: [id, connection_id, sender_id, type, text, created_at]
      properties:
        id: { type: string, pattern: "^msg_[A-Za-z0-9-]{16,80}$" }
        connection_id: { type: string }
        sender_id: { type: string }
        type: { type: string, const: TEXT }
        text: { type: string, minLength: 1, maxLength: 1000 }
        created_at: { type: string, format: date-time }
    DirectConversation:
      type: object
      required: [connection_id, status, counterpart, context, messages, unread_count, last_read_message_id, has_more]
      properties:
        connection_id: { type: string }
        status: { type: string, const: ACTIVE }
        counterpart:
          type: object
          required: [id, display_name, avatar]
          properties:
            id: { type: string }
            display_name: { type: string }
            avatar: { type: string }
            role: { type: [string, "null"] }
        context:
          type: object
          required: [event_id, event_name, source, consent_mode, connected_at]
          properties:
            event_id: { type: string }
            event_name: { type: string }
            source: { type: string }
            consent_mode: { type: string }
            connected_at: { type: string, format: date-time }
        messages:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/DirectConversationMessage" }
        unread_count: { type: integer, minimum: 0 }
        last_read_message_id:
          oneOf:
            - { type: string, pattern: "^msg_[A-Za-z0-9-]{16,80}$" }
            - { type: "null" }
        has_more: { type: boolean }
    DirectConversationMessageResult:
      type: object
      required: [message, idempotent_replay]
      properties:
        message: { $ref: "#/components/schemas/DirectConversationMessage" }
        idempotent_replay: { type: boolean }
    PresenceInput:
      type: object
      required: [latitude, longitude, accuracy_m]
      properties:
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        accuracy_m: { type: number, minimum: 0, maximum: 1000 }
    ProjectInput:
      type: object
      required: [event_id, title, summary, role_need]
      properties:
        event_id: { type: string }
        origin_connection_id:
          type: string
          maxLength: 128
          description: Optional active Connection used to attribute the 72-hour collaboration funnel.
        title: { type: string, maxLength: 100 }
        summary: { type: string, maxLength: 500 }
        role_need:
          type: object
          required: [title, skills, capacity]
          properties:
            title: { type: string, maxLength: 80 }
            skills:
              type: array
              maxItems: 8
              items: { type: string, maxLength: 40 }
            capacity: { type: integer, minimum: 1, maximum: 10 }
    SosInput:
      type: object
      required: [category, problem, context, attempts, required_skills, estimated_minutes, location_label, deadline, resolution_criteria]
      properties:
        category:
          type: string
          enum: [技术/硬件, 模型/数据, 部署/API, 设计/交互, 测试/演示, 路演/商业, 设备/资源]
        problem: { type: string, maxLength: 500 }
        context: { type: string, maxLength: 1000 }
        attempts:
          type: array
          maxItems: 10
          items: { type: string, maxLength: 200 }
        required_skills:
          type: array
          maxItems: 10
          items: { type: string, maxLength: 50 }
        estimated_minutes: { type: integer, minimum: 5, maximum: 480 }
        location_label: { type: string, maxLength: 100 }
        deadline: { type: string, format: date-time }
        resolution_criteria: { type: string, maxLength: 500 }
        reward_intent:
          type: object
          nullable: true
          required: [type]
          description: >-
            PAID_INTENT also requires amount, currency, delivery_standard, and
            payment_note. COSPAN records intent only and never processes payment.
          properties:
            type: { type: string, enum: [VOLUNTEER, GIFT, POINTS, PAID_INTENT] }
            description: { type: string, maxLength: 500 }
            currency: { type: string, pattern: "^[A-Z]{3}$" }
            amount: { type: integer, minimum: 1, maximum: 100000 }
            delivery_standard: { type: string, maxLength: 500 }
            payment_note: { type: string, maxLength: 500 }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
  responses:
    BadRequest:
      description: Invalid path encoding, JSON, or request fields
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: A valid session is required
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: The current user lacks permission for this operation
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Requested object was not found or is not visible
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: The state transition conflicts with current state
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: The verification-code sending limit has been reached
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PayloadTooLarge:
      description: JSON payload exceeds 64 KiB
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
